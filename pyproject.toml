[project]
name = "matchbook"
version = "0.1.0"
description = "A price-time-priority matching engine and event-driven market simulator."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tanusri Madhalam" }]
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
